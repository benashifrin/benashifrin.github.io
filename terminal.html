        // The writing lives encrypted in locked/terminal-thoughts.json — it is not
        // in this file. Edit _private/terminal-thoughts.html, then: node encrypt.js
        let thoughtsGateSeq = 0;
        commands.thoughts = function() {
            const id = 'thoughts-gate-' + (++thoughtsGateSeq);
            // processCommand() is synchronous, so return a placeholder and fill it
            // in once the output has been added to the DOM.
            setTimeout(function() { mountThoughtsGate(id); }, 0);
            return `<div id="${id}" class="blog-container"><div class="output-text">Loading...</div></div>`;
        };

        function mountThoughtsGate(id) {
            const host = document.getElementById(id);
            if (!host) return;

            function askFor(message) {
                host.innerHTML = `<div class="output-text">${message}</div>
<div class="input-line"><span class="input-chevron">&#10095;</span><input type="password" class="gate-input" id="${id}-input" placeholder="Password" autocomplete="current-password"></div>
<div class="output-text">Email ben for the password.</div>`;
                const field = document.getElementById(id + '-input');
                field.focus();
                field.addEventListener('keydown', function(e) {
                    if (e.key !== 'Enter' || !field.value) return;
                    e.stopPropagation();
                    const pw = field.value;
                    host.innerHTML = '<div class="output-text">Unlocking...</div>';
                    attempt(pw, false);
                });
            }

            function attempt(pw, fromSession) {
                Gate.decrypt('locked/terminal-thoughts.json', pw).then(function(html) {
                    try { sessionStorage.setItem(Gate.SESSION_KEY, pw); } catch (e) {}
                    host.innerHTML = html;
                }).catch(function() {
                    if (fromSession) {
                        // Stale saved password — just ask again without an error.
                        try { sessionStorage.removeItem(Gate.SESSION_KEY); } catch (e) {}
                        askFor('These thoughts are private.');
                    } else {
                        askFor('Wrong password.');
                    }
                });
            }

            let saved = null;
            try { saved = sessionStorage.getItem(Gate.SESSION_KEY); } catch (e) {}
            if (saved) { attempt(saved, true); } else { askFor('These thoughts are private.'); }
        }

<span class="section-title">Frameworks and Mindset</span>

The hard part of building a company is that no one is telling you what to do. There isn't a step-by-step how-to guide on YouTube or the internet. I guess there are, but following some random influencer wont let you be successful especially because they will probably sell you drop shipping lol.

<span class="subsection-title">Startup Frameworks</span>

<span class="bold-text">Solve a problem</span>
Starting a company at its core is solving a problem for the end-user. Defining the problem clearly and explaining it to a user is key.
<span class="framework-ask">Ask: What is the problem you are solving? How many people have confirmed this is a problem they face?</span>

<span class="bold-text">Competition is good</span>
MySpace started before Facebook, AltaVista started before Google. Competition means that others have found product market fit and have validated your idea.
<span class="framework-ask">Ask: What can you do differently from your competition?</span>

<span class="bold-text">High leverage</span>
There are endless things to do when starting your own company. Prioritization is key. Talking to customers would be most important for me at this stage.
<span class="framework-ask">Ask: Write down everything your company needs to do. Find what is most pivotal and prioritize accordingly.</span>

<span class="bold-text">Bottlenecks</span>
Usually when starting a company there are two things: making things and selling things. What is your bottleneck? Focused time spent coding? Or lack of connections in the industry?
<span class="framework-ask">Ask: What is stopping me from doing whats most important?</span>

<span class="bold-text">Failing fast/Wasting Time</span>
Time is the most precious thing a startup has. The only thing I don't want to do is waste my time working on projects that no one wants.
<span class="framework-ask">Ask: What would be the reason I failed? Test those hypotheses.</span>

<span class="bold-text">Talking to other people/Specifics</span>
Ask "How many times has this affected you in the past month" — that will tell you much more of their burning pain points.
<span class="framework-ask">Ask: What specifics can I ask the customer?</span>

Most companies save money, make money, or save the customer time. Measure it. That will show your strength in the market.

        commands.clear = function() {
            document.getElementById('output').innerHTML = '';
            return null;
        };

        // ── Terminal engine ──

        const output = document.getElementById('output');
        const input = document.getElementById('command-input');

        function createPromptHTML() {
            return `<div class="prompt-line"><span class="prompt-user">visitor@benshifrin.com</span><span class="prompt-in">in</span><span class="prompt-path">~</span><span class="prompt-branch">main</span></div>`;
        }

        function addOutput(html) {
            const block = document.createElement('div');
            block.className = 'output-block';
            block.innerHTML = html;
            output.appendChild(block);
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function processCommand(cmd) {
            const trimmed = cmd.trim().toLowerCase();

            // Show the prompt + typed command
            const echoHTML = createPromptHTML() +
                `<div class="input-line"><span class="input-chevron">&#10095;</span><span class="cmd-typed"> ${escapeHTML(cmd.trim())}</span></div>`;

            if (trimmed === '') {
                addOutput(echoHTML);
                return;
            }

            commandHistory.push(cmd.trim());
            historyIndex = commandHistory.length;

            if (trimmed === 'clear') {
                commands.clear();
                return;
            }

            let result;
            if (commands[trimmed]) {
                result = commands[trimmed]();
            } else {
                result = `<div class="error-text">Command not found: ${escapeHTML(trimmed)}. Type 'help' for available commands.</div>`;
            }

            addOutput(echoHTML + (result || ''));
        }

        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // Welcome message
        function showWelcome() {
            const welcome = `<div class="welcome-box">  ┌─────────────────────────────────────────┐
  │   Welcome to benshifrin.com             │
  └─────────────────────────────────────────┘</div>
<div class="welcome-text">Type 'help' for available commands.</div>`;
            addOutput(welcome);
        }

        showWelcome();

        // Input handling
        input.addEventListener('keydown', function(e) {
            if (e.key === 'c' && e.ctrlKey) {
                e.preventDefault();
                commands.clear();
                input.value = '';
            } else if (e.key === 'Enter') {
                processCommand(input.value);
                input.value = '';
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (historyIndex > 0) {
                    historyIndex--;
                    input.value = commandHistory[historyIndex];
                }
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (historyIndex < commandHistory.length - 1) {
                    historyIndex++;
                    input.value = commandHistory[historyIndex];
                } else {
                    historyIndex = commandHistory.length;
                    input.value = '';
                }
            }
        });

        // Click anywhere to focus input
        document.body.addEventListener('click', function(e) {
            if (!e.target.closest('a') && !e.target.closest('.gate-input')) {
                input.focus();
            }
        });

        // Prevent links from stealing focus
        document.addEventListener('click', function(e) {
            if (e.target.tagName === 'A') {
                e.stopPropagation();
            }
        });
    </script>
